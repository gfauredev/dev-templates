[toolchain]
channel = "stable"
components = ["rust-src", "rustfmt", "clippy", "rust-analyzer", "llvm-tools"]
targets = [
  "thumbv6m-none-eabi",            # Cortex-M0/M0+
  "thumbv7m-none-eabi",            # Cortex-M3
  "thumbv7em-none-eabi",           # Cortex-M4/M7, soft-float
  "thumbv7em-none-eabihf",         # Cortex-M4F/M7F
  "thumbv8m.main-none-eabihf",     # Cortex-M33/M55
  "riscv32imac-unknown-none-elf",  # RIOT RISC-V boards (fe310, gd32v), ESP32-C6/H2
  "riscv32imc-unknown-none-elf",   # ESP32-C3
  "aarch64-unknown-linux-gnu",
  "armv7-unknown-linux-gnueabihf",
]
